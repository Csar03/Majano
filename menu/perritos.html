<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Perritos - Restaurante Majano</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
        <header>
            <a href="../index.html"><img src="../resources/mulaMajano.png" alt="Logo Majano" class="logo"></a>
            <h1>Perritos</h1>
            <a href="../pages/carta.html" class="back-button">Volver a Carta</a>
        </header>
        <main>
            <div class="menu-section">
                <div class="dish">
                    <h3>Hot Dog</h3>
                    <p>1,50€</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                    </div>
                </div>
                <div class="dish">
                    <h3>Doberman</h3>
                    <p>2,50€</p>
                    <p>(Carne picada y Tabasco)</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                    </div>
                </div>
                <div class="dish">
                    <h3>York Shire</h3>
                    <p>2,00€</p>
                    <p>(Bacon)</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                    </div>
                </div>
                <div class="dish">
                    <h3>Galgo</h3>
                    <p>2,00€</p>
                    <p>(Queso)</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                        <span class="allergen lacteos" title="Lácteos">🧀</span>
                    </div>
                </div>
                <div class="dish">
                    <h3>Podenco</h3>
                    <p>2,00€</p>
                    <p>(Bacon y Queso)</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                        <span class="allergen lacteos" title="Lácteos">🧀</span>
                    </div>
                </div>
                <div class="dish">
                    <h3>Caniche</h3>
                    <p>2,00€</p>
                    <p>(Cebolla)</p>
                    <div class="allergens">
                        <span class="allergen gluten" title="Gluten">🍞</span>
                    </div>
                </div>
            </div>
            <div class="allergen-legend">
                <div class="legend-item"><span class="legend-icon">🍞</span>Gluten</div>
                <div class="legend-item"><span class="legend-icon">🧀</span>Lácteos</div>
                <div class="legend-item"><span class="legend-icon">🥚</span>Huevos</div>
                <div class="legend-item"><span class="legend-icon">🐟</span>Pescado</div>
                <div class="legend-item"><span class="legend-icon">🦑</span>Moluscos</div>
                <div class="legend-item"><span class="legend-icon">🫘</span>Soja</div>
                <div class="legend-item"><span class="legend-icon">🌰</span>Frutos secos</div>
            </div>
        </main>
        <div id="footer-container"></div>
        <script src="../js/script.js"></script>
        <script src="../footer/footer.js"></script>
    </body>
</html>
